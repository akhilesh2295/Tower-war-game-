<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141a2b" />
    <meta name="description" content="Link your towers, send your people and conquer the map." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tower Tide" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Tower Tide</title>
  </head>
  <body data-screen="menu">
    <div id="app">
      <header id="hud">
        <button id="btn-pause" class="hud-btn" aria-label="Pause">❚❚</button>
        <div class="hud-mid">
          <div class="hud-row"><span id="hud-title"></span><span id="hud-timer">0:00</span></div>
          <div id="strength" aria-label="Team strength"></div>
        </div>
        <button id="btn-speed" class="hud-btn" aria-label="Game speed">1×</button>
      </header>
      <main id="stage">
        <canvas id="board"></canvas>
      </main>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
